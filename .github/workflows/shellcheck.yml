name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning fix-emsign-g3only.sh
      - run: bash -n fix-emsign-g3only.sh
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.8', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ['debian:bookworm', 'ubuntu:24.04']
    steps:
      - uses: actions/checkout@v4
      - name: Test actual Debian/Ubuntu trust store in disposable container
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -e EMSIGN_DISPOSABLE_CONTAINER=1 \
            -v "$PWD:/work:ro" -w /work "$TEST_IMAGE" \
            bash -c 'apt-get update && apt-get install -y --no-install-recommends ca-certificates python3 && python3 tests/integration.py'
